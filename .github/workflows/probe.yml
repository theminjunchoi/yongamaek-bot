name: probe

# 러너 환경에서 CGV API가 통하는지 1회 조회로 확인하는 진단용 워크플로.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CGV가 러너 IP를 막아 Worker 중계로 조회한다 (src/sources/cgv_endpoint.py)
    env:
      CGV_RELAY_URL: https://cgv-relay.yongamaek.workers.dev
      CGV_RELAY_TOKEN: ${{ secrets.CGV_RELAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m src.main --once | tail -3
      - name: 좌석맵 API(searchIfSeatData) 접근 진단
        run: python3 .github/scripts/probe_seatmap.py
      - name: 게이트 방식 1분 사이클 소요시간 실측
        run: python3 .github/scripts/probe_gate_cycle.py
