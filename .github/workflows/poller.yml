name: poller

# 30분마다 잡을 큐잉하지만 concurrency 그룹이 동시 실행을 막으므로,
# 실제로는 5시간 20분짜리 폴링 잡이 끝나는 즉시 대기 중인 다음 잡이 시작된다.
# (GitHub은 같은 그룹의 대기 잡을 최신 1개만 남기고 정리한다)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "상태 캐시를 버리고 알림 없이 기준선부터 다시 잡기 (중단 후 재개 시)"
        type: boolean
        default: false

concurrency:
  group: poller
  cancel-in-progress: false

# 상태는 저장소에 커밋하지 않고 Actions 캐시로 잡 사이에 넘긴다 (쓰기 권한 불필요).
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # 상태(스냅샷·좌석 기준선·오픈 기록)는 캐시로 이어받는다. 캐시 키는 불변이라
      # 잡마다 새 키로 저장하고, 복원은 접두사로 가장 최근 것을 고른다.
      # 캐시가 없으면(첫 실행·7일 미사용 만료·reset_state) 봇이 알림 없이 기준선만 잡는다.
      - name: 상태 복원
        if: ${{ !inputs.reset_state }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: routes.json 생성 (Secrets)
        env:
          ROUTES_JSON: ${{ secrets.ROUTES_JSON }}
        run: printf '%s' "$ROUTES_JSON" > routes.json

      - name: 의존성 설치 (멤버 봇용)
        run: pip install -q -r requirements.txt

      - name: 폴링 + 멤버 봇 실행 (5시간 20분)
        env:
          MAX_RUNTIME_SEC: "19200"
          CGV_RELAY_URL: https://cgv-relay.yongamaek.workers.dev
          CGV_RELAY_TOKEN: ${{ secrets.CGV_RELAY_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python3 -m src.bot.member_bot &
          MEMBER_PID=$!
          python3 -m src.main
          kill $MEMBER_PID 2>/dev/null || true

      # 잡이 실패·취소돼도 그때까지의 상태는 남긴다 (상태 파일은 매 사이클 원자적으로 저장됨).
      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
