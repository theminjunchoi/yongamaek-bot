name: poller

# 30분마다 잡을 큐잉하지만 concurrency 그룹이 동시 실행을 막으므로,
# 실제로는 5시간 20분짜리 폴링 잡이 끝나는 즉시 대기 중인 다음 잡이 시작된다.
# (GitHub은 같은 그룹의 대기 잡을 최신 1개만 남기고 정리한다)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: routes.json 생성 (Secrets)
        env:
          ROUTES_JSON: ${{ secrets.ROUTES_JSON }}
        run: printf '%s' "$ROUTES_JSON" > routes.json

      - name: 의존성 설치 (멤버 봇용)
        run: pip install -q -r requirements.txt

      - name: 폴링 + 멤버 봇 실행 (5시간 20분)
        env:
          MAX_RUNTIME_SEC: "19200"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python3 -m src.bot.member_bot &
          MEMBER_PID=$!
          python3 -m src.main
          kill $MEMBER_PID 2>/dev/null || true

      - name: 스냅샷·오픈 기록 커밋
        # 폴링·알림은 이미 끝났다. 여기(상태 저장)가 실패해도 다음 잡이 스냅샷을
        # 재구축하므로, 이 스텝은 절대 잡을 실패시키지 않는다(항상 exit 0).
        # 잡 수명(5h20m) 동안 원격이 앞서갔을 수 있으므로(코드 push 등),
        # 원격 최신으로 reset한 뒤 우리 상태파일만 다시 얹어 push한다(untracked/non-ff 회피).
        if: always()
        run: |
          git config user.name "yongamaek-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "스냅샷 변경 없음"; exit 0
          fi
          backup=$(mktemp -d)
          cp -a state/. "$backup"/ 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main || { echo "fetch 실패 (재시도 $attempt)"; sleep $((attempt*3)); continue; }
            git reset --hard origin/main
            mkdir -p state
            cp -a "$backup"/. state/ 2>/dev/null || true
            git add state/
            if git diff --cached --quiet; then
              echo "원격이 이미 최신 — 커밋 불필요"; exit 0
            fi
            git commit -m "chore: 스냅샷·오픈 기록 갱신"
            if git push; then
              echo "스냅샷 커밋·push 성공"; exit 0
            fi
            echo "push 경합 — 재시도 $attempt"; sleep $((attempt*3))
          done
          echo "스냅샷 커밋 최종 실패 — 다음 잡에서 재구축됨 (잡은 성공 처리)"
          exit 0
